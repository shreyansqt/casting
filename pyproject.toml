[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casting"
version = "0.1.0"
description = "Choose a harness and model for an opaque work key and task profile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
casting = "casting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
